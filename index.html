<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AwayTerminal</title>
  <script>
    // 前端例外回報：這個專案的驗證不能靠開 devtools（共用桌面、不搶焦點），
    // 所以把 window.onerror / unhandledrejection 直接送到後端 stdout。
    // 用 inline script 而不是放在 module 裡：module script 是 defer 的，
    // 模組載入期間就炸掉的錯誤會來不及被攔到。
    (function () {
      var pending = [];
      function send(line) {
        var inv = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
        if (!inv) { pending.push(line); return; }
        while (pending.length) inv('log_line', { msg: pending.shift() });
        inv('log_line', { msg: line });
      }
      window.addEventListener('error', function (e) {
        var where = e.filename ? ' @ ' + e.filename + ':' + e.lineno + ':' + e.colno : '';
        var stack = e.error && e.error.stack ? '\n' + e.error.stack : '';
        send('[js-error] ' + (e.message || e.error) + where + stack);
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        send('[js-reject] ' + (r && r.stack ? r.stack : r));
      });
      window.AwayReportError = send;
    })();
  </script>
</head>
<body>
  <!-- 版面照舊版 MainWindow.xaml：上方工具列 ＋ 左邊終端機（黃框）＋ 可拖寬的右側分頁列。
       #terminals / #searchbar 的 id 與內部 class 全部照舊版 web/index.html——
       terminal.js 直接 querySelector 這些名字，不可以改。 -->
  <div id="app">
    <!-- 按鈕順序照舊版 MainWindow.xaml 的工具列。舊版還有「遠端」（Telegram，階段 4），
         那個功能還沒做 → 不放佔位按鈕。 -->
    <div id="toolbar">
      <button id="btn-new" type="button" class="tool-btn">新分頁 ▾</button>
      <button id="btn-favs" type="button" class="tool-btn">我的最愛 ▾</button>
      <span class="tool-sep"></span>
      <button id="btn-copy" type="button" class="tool-btn">複製</button>
      <button id="btn-paste" type="button" class="tool-btn">純文字貼上</button>
      <button id="btn-copyall" type="button" class="tool-btn">複製全部</button>
      <button id="btn-clear" type="button" class="tool-btn">清除畫面</button>
      <button id="btn-page" type="button" class="tool-btn">翻頁 ▾</button>
      <button id="btn-compose" type="button" class="tool-btn">輸入文字</button>
      <span class="tool-sep"></span>
      <button id="btn-view" type="button" class="tool-btn">視窗分割</button>
      <span class="tool-sep"></span>
      <button id="btn-settings" type="button" class="tool-btn">其他設定</button>
      <button id="btn-about" type="button" class="tool-btn">關於</button>
      <span class="tool-spacer"></span>
      <button id="btn-tabpanel" type="button" class="tool-arrow">▲</button>
    </div>

    <div id="main">
      <!-- 終端機（黃框）：#terminals 用 position:absolute inset:0 填滿它 -->
      <div id="termframe">
        <div id="terminals"></div>
        <div id="searchbar">
          <input id="search-input" type="text" placeholder="搜尋" />
          <span id="search-count"></span>
          <button id="search-prev" title="上一個 (Shift+Enter)">▲</button>
          <button id="search-next" title="下一個 (Enter)">▼</button>
          <button id="search-close" title="關閉 (Esc)">✕</button>
        </div>
      </div>

      <!-- 拖曳區：改變右側列表框寬度（拖完存設定，同舊版 TabSplitter） -->
      <div id="tabsplitter"></div>

      <div id="tabpanel"><div id="tabstrip"></div></div>
    </div>
  </div>

  <!-- 分頁右鍵選單（舊版 ContextMenu：更改名稱 / 記錄 log… / 配色 ▸ / 關閉）。
       配色的色票由 settings.palette 填進 #color-items。 -->
  <div id="tab-menu" class="popup-menu" hidden>
    <div class="menu-item" data-act="rename">更改名稱</div>
    <div class="menu-item" data-act="log">記錄 log…</div>
    <div class="menu-item" data-act="macro">執行巨集…</div>
    <div class="menu-item has-sub" data-act="color">配色
      <span class="menu-arrow">▸</span>
      <div class="popup-menu submenu" id="color-menu">
        <div class="menu-item" data-color="">預設（設定顏色）</div>
        <div class="menu-sep"></div>
        <div id="color-items"></div>
      </div>
    </div>
    <!-- 沙盒模式（新功能）：勾勾顯示的是**連線設定**的值，改了下次啟動生效 -->
    <div class="menu-item" data-act="sandbox">沙盒模式</div>
    <div class="menu-item" data-act="sandbox-clear">清除沙盒…</div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-act="close">關閉</div>
  </div>

  <!-- 新分頁下拉（舊版 New 下拉；SSH / 連接埠 / WSL / ADB 之後補在這裡） -->
  <!-- 新分頁下拉（舊版 New 下拉的結構：預設區 → 分隔線 → 使用者的自訂連線 → 分隔線 → 管理）。
       #new-conns 由 settings.customConns 填；連線沒開沙盒的會標「無沙盒」。 -->
  <div id="new-menu" class="popup-menu" hidden>
    <div class="menu-item" data-kind="shell">PowerShell</div>
    <div class="menu-item" data-kind="ssh">SSH…</div>
    <div class="menu-item" data-kind="ssh-quick">快速連線（host[:port]）…</div>
    <div class="menu-item" data-kind="com">連接埠…</div>
    <div class="menu-sep"></div>
    <div id="new-conns"></div>
    <div class="menu-item" data-kind="custom">自訂指令…</div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-kind="manage">自訂連線設定…</div>
  </div>

  <!-- 我的最愛下拉（舊版 Favorites_Click：各筆最愛 → 分隔線 → 加到我的最愛 → 設定…） -->
  <div id="favs-menu" class="popup-menu" hidden>
    <div id="favs-items"></div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-fav="add">加到我的最愛：目前分頁</div>
    <div class="menu-item" data-fav="manage">設定…</div>
  </div>

  <!-- 我的最愛設定（舊版 FavoritesDialog：改名、刪除、排序） -->
  <div id="favs" hidden>
    <div id="favs-box">
      <div id="favs-title"></div>
      <div id="favs-list"></div>
      <div id="favs-note"></div>
      <div class="modal-buttons">
        <button id="favs-up" type="button">上移</button>
        <button id="favs-down" type="button">下移</button>
        <button id="favs-rename" type="button">改名</button>
        <button id="favs-delete" type="button">刪除</button>
        <button id="favs-close" type="button">關閉</button>
      </div>
    </div>
  </div>

  <!-- 翻頁下拉（舊版 Page_Click 的 ContextMenu） -->
  <div id="page-menu" class="popup-menu" hidden>
    <div class="menu-item" data-scroll="up">上一頁</div>
    <div class="menu-item" data-scroll="down">下一頁</div>
    <div class="menu-sep"></div>
    <div class="menu-item" data-scroll="top">移到最上面</div>
    <div class="menu-item" data-scroll="bottom">移到最下面</div>
  </div>

  <!-- 終端機右鍵選單（舊版 OnWebContextMenu，取代 webview 預設選單） -->
  <div id="term-menu" class="popup-menu" hidden>
    <div class="menu-item" data-term="copy">複製</div>
    <div class="menu-item" data-term="copyPaste">複製且貼上</div>
    <div class="menu-item" data-term="paste">純文字貼上</div>
    <div class="menu-item" data-term="copyall">複製全部</div>
    <div class="menu-item" data-term="copyAllFile">複製全部存至檔案</div>
    <div class="menu-sep"></div>
    <!-- 全選：舊版 Loc.cs 有 ctx.selectAll 字串但沒有任何呼叫端（A 協定是死的）。
         Agent-11 決定當作新功能補上，見 docs/REGRESSION-CHECKLIST.md 的「刻意不同」表。 -->
    <div class="menu-item" data-term="selectAll">全選</div>
    <div class="menu-item" data-term="search">搜尋</div>
  </div>

  <!-- 網址選單（舊版 ShowUrlMenu，由 U 協定觸發） -->
  <div id="url-menu" class="popup-menu" hidden>
    <div class="menu-item" data-url="open">從瀏覽器開啟</div>
    <div class="menu-item" data-url="copy">複製網址</div>
  </div>

  <!-- 複製提示（舊版 CopyPopup + ShowCopyFeedback） -->
  <div id="toast" hidden></div>

  <!-- 自訂連線設定（舊版 CustomConnDialog：左邊清單、右邊編輯區、自動偵測）。
       沙盒那個核取方塊是新功能，舊版沒有。 -->
  <div id="conns" hidden>
    <div id="conns-box">
      <div id="conns-title">自訂連線</div>
      <div id="conns-main">
        <div id="conns-list"></div>
        <form id="conns-form">
          <label>名稱<input id="cf-name" type="text" autocomplete="off" spellcheck="false" /></label>
          <label>執行檔<span class="cf-path-row"><input id="cf-path" type="text" autocomplete="off" spellcheck="false" /><button id="cf-browse" type="button">瀏覽…</button></span></label>
          <label>參數<input id="cf-args" type="text" autocomplete="off" spellcheck="false" /></label>
          <label>關閉鍵
            <span class="cf-close-row">
              <select id="cf-closekey">
                <option value="ctrl-c">Ctrl+C</option>
                <option value="ctrl-d">Ctrl+D</option>
                <option value="none">不送</option>
              </select>
              <input id="cf-closecount" type="number" min="1" max="5" />
              <span class="cf-hint">次</span>
            </span>
          </label>
          <label class="cf-check"><input id="cf-pickdir" type="checkbox" /><span>啟動前選擇工作目錄</span></label>
          <label class="cf-check"><input id="cf-viaps" type="checkbox" /><span>透過 PowerShell 執行（.cmd 需要）</span></label>
          <label class="cf-check"><input id="cf-hidden" type="checkbox" /><span>隱藏（不列在「新分頁」下拉）</span></label>
          <label class="cf-check"><input id="cf-sandbox" type="checkbox" /><span>沙盒模式（建議開啟）</span></label>
          <div class="modal-buttons">
            <button id="cf-save" type="submit">儲存</button>
            <button id="cf-delete" type="button">刪除</button>
          </div>
        </form>
      </div>
      <div id="conns-note"></div>
      <div class="modal-buttons">
        <button id="conns-detect" type="button">自動偵測</button>
        <button id="conns-new" type="button">新增</button>
        <button id="conns-close" type="button">關閉</button>
      </div>
    </div>
  </div>

  <!-- 主機金鑰確認（語意照 PuTTY：第一次連線／金鑰變更兩種文案，三個選項）。
       獨立於一般對話框，因為它有三個按鈕而且「金鑰變更」要更嚴重的樣式。 -->
  <div id="hostkey" hidden>
    <div id="hostkey-box">
      <div id="hostkey-title"></div>
      <div id="hostkey-body"></div>
      <table id="hostkey-fp">
        <tbody>
          <tr><th>主機</th><td id="hk-host"></td></tr>
          <tr><th>演算法</th><td id="hk-alg"></td></tr>
          <tr><th>SHA256</th><td id="hk-sha256"></td></tr>
          <tr><th>MD5</th><td id="hk-md5"></td></tr>
        </tbody>
      </table>
      <div id="hostkey-note"></div>
      <div class="modal-buttons">
        <button id="hk-store" type="button">接受並儲存</button>
        <button id="hk-once" type="button">只這次</button>
        <button id="hk-cancel" type="button">取消</button>
      </div>
    </div>
  </div>

  <!-- SSH 連線對話框（B6）。欄位照舊版 ConnectDialog 的 SSH 頁，外加「進階」。
       密碼**沒有欄位**——連上之後在終端機裡問（同 PuTTY／舊版），也不會被存起來。 -->
  <div id="sshdlg" hidden>
    <form id="sshdlg-box">
      <div id="sshdlg-title"></div>
      <div class="sd-grid">
        <!-- 類型（舊版 ConnectDialog 的 TypeCombo）：切換會把 22 ↔ 23 換掉 -->
        <label id="sd-l-type">類型</label>
        <span class="sd-row">
          <select id="sd-type">
            <option value="ssh">SSH</option>
            <option value="telnet">Telnet</option>
          </select>
        </span>

        <label id="sd-l-host">IP / 主機</label>
        <span class="sd-row">
          <input id="sd-host" type="text" autocomplete="off" spellcheck="false" />
          <span id="sd-l-port">Port</span>
          <input id="sd-port" type="number" min="1" max="65535" />
        </span>

        <label id="sd-l-user" data-ssh-only>帳號</label>
        <span class="sd-row" data-ssh-only>
          <input id="sd-user" type="text" autocomplete="off" spellcheck="false" />
          <span id="sd-user-hint" class="sd-hint"></span>
        </span>

        <label id="sd-l-key" data-ssh-only>金鑰檔</label>
        <span class="sd-row" data-ssh-only>
          <input id="sd-key" type="text" autocomplete="off" spellcheck="false" />
          <button id="sd-key-browse" type="button">瀏覽…</button>
        </span>

        <label id="sd-l-keep">保持連線</label>
        <span class="sd-row">
          <input id="sd-keep" type="number" min="0" max="1440" />
          <span id="sd-keep-hint" class="sd-hint"></span>
        </span>
      </div>

      <label class="sd-check" data-ssh-only><input id="sd-agent" type="checkbox" /><span id="sd-l-agent"></span></label>
      <label class="sd-check"><input id="sd-reconnect" type="checkbox" /><span id="sd-l-reconnect"></span></label>

      <details id="sd-adv" data-ssh-only>
        <summary id="sd-l-adv"></summary>
        <div id="sd-adv-note" class="sd-hint"></div>
        <div id="sd-algos"></div>
        <label id="sd-l-env" class="sd-envlabel"></label>
        <textarea id="sd-env" rows="3" spellcheck="false"></textarea>
        <div id="sd-env-hint" class="sd-hint"></div>
      </details>

      <div id="sd-note"></div>
      <div class="modal-buttons">
        <button id="sd-ok" type="submit">連線</button>
        <button id="sd-fav" type="button">加到我的最愛</button>
        <button id="sd-cancel" type="button">取消</button>
      </div>
    </form>
  </div>

  <!-- 輸入文字（舊版 Dialogs/ComposeDialog）：上排四個連結（載入文字檔／清除／復原／儲存）、
       中間多行輸入框（IME 在這裡組字，不經 xterm）、下排「送出後送 Enter」＋返回／送出。
       Ctrl+Enter ＝送出。草稿在程式存活期間保留（送出才清空）。 -->
  <div id="composedlg" hidden>
    <div id="composedlg-box">
      <div id="composedlg-title"></div>
      <div id="cp-links">
        <button id="cp-load" type="button" class="link-btn"></button>
        <button id="cp-clear" type="button" class="link-btn"></button>
        <button id="cp-undo" type="button" class="link-btn"></button>
        <button id="cp-save" type="button" class="link-btn"></button>
      </div>
      <div id="cp-inputwrap">
        <textarea id="cp-input" rows="12" spellcheck="false"></textarea>
        <div id="cp-placeholder"></div>
      </div>
      <label class="sd-check"><input id="cp-sendenter" type="checkbox" /><span id="cp-l-sendenter"></span></label>
      <div id="cp-note" class="sd-hint"></div>
      <div class="modal-buttons">
        <button id="cp-send" type="button">送出</button>
        <button id="cp-back" type="button">返回</button>
      </div>
    </div>
  </div>

  <!-- 巨集的對話框（`messagebox`／`yesnobox`／`inputbox`／`passwordbox`／`listbox`）。
       一個元件應付所有種類：Rust 端 emit `macro-dialog`，前端問完呼叫 `macro_answer`。
       `statusbox` 是不等回覆的常駐提示（顯示在右下角）。 -->
  <div id="macrodlg" hidden>
    <form id="macrodlg-box">
      <div id="macrodlg-title"></div>
      <div id="macrodlg-body"></div>
      <input id="md-input" type="text" autocomplete="off" spellcheck="false" hidden />
      <select id="md-list" size="6" hidden></select>
      <div class="modal-buttons">
        <button id="md-ok" type="submit">確定</button>
        <button id="md-no" type="button" hidden>否</button>
        <button id="md-cancel" type="button" hidden>取消</button>
      </div>
    </form>
  </div>

  <!-- `statusbox`：不等回覆，顯示在右下角直到 `closesbox` -->
  <div id="macrostatus" hidden></div>

  <!-- 連接埠（舊版 Dialogs/ComDialog）：Port / Baud rate / Data bits / Parity / Stop bits /
       Flow control / 斷線自動重連 + 「回到預設」。欄位、順序、預設值都照舊版。
       ⚠️ 選項清單由後端的 `com_ports()` 給——`serialport` 不支援的值（Mark/Space 同位、
       1.5 停止位元、RTS/CTS+XON/XOFF）**不列出來**，列了會騙人。見 docs/COM.md。 -->
  <div id="comdlg" hidden>
    <form id="comdlg-box">
      <div id="comdlg-title"></div>
      <div class="sd-grid">
        <label id="cd-l-port">Port</label>
        <span class="sd-row">
          <input id="cd-port" list="cd-port-list" type="text" autocomplete="off" spellcheck="false" />
          <datalist id="cd-port-list"></datalist>
          <button id="cd-refresh" type="button">重新掃描</button>
        </span>

        <label id="cd-l-baud">Baud rate</label>
        <span class="sd-row">
          <input id="cd-baud" list="cd-baud-list" type="text" autocomplete="off" spellcheck="false" />
          <datalist id="cd-baud-list"></datalist>
        </span>

        <label id="cd-l-data">Data bits</label>
        <span class="sd-row"><select id="cd-data"></select></span>

        <label id="cd-l-parity">Parity</label>
        <span class="sd-row"><select id="cd-parity"></select></span>

        <label id="cd-l-stop">Stop bits</label>
        <span class="sd-row"><select id="cd-stop"></select></span>

        <label id="cd-l-flow">Flow control</label>
        <span class="sd-row"><select id="cd-flow"></select></span>
      </div>

      <label class="sd-check"><input id="cd-reconnect" type="checkbox" /><span id="cd-l-reconnect"></span></label>
      <div id="cd-ports-note" class="sd-hint"></div>

      <div id="cd-note"></div>
      <div class="modal-buttons">
        <button id="cd-reset" type="button">回到預設</button>
        <button id="cd-ok" type="submit">開啟</button>
        <button id="cd-fav" type="button">加到我的最愛</button>
        <button id="cd-cancel" type="button">取消</button>
      </div>
    </form>
  </div>

  <!-- 離開程式（舊版 Dialogs/ExitDialog）：勾「下次開啟恢復目前分頁（含畫面上的舊訊息）」。
       勾選狀態記在 settings 的 exitRestoreTabs。舊版還有一個「更新 CLAUDE.md」的勾選，
       那屬於代理團隊（階段 4），這裡先不放。 -->
  <div id="exitdlg" hidden>
    <div id="exitdlg-box">
      <div id="exitdlg-title"></div>
      <div id="exitdlg-body"></div>
      <label class="sd-check"><input id="ex-restore" type="checkbox" /><span id="ex-l-restore"></span></label>
      <div class="modal-buttons">
        <button id="ex-go" type="button">離開</button>
        <button id="ex-cancel" type="button">取消</button>
      </div>
    </div>
  </div>

  <!-- 弱演算法警告（PuTTY 的 warn-below-this-line）：協商到警告線以下的演算法時跳。
       接受之後這台主機就不再問（記在 settings 的 sshWeakAccepted）。 -->
  <div id="weakalgo" hidden>
    <div id="weakalgo-box">
      <div id="weakalgo-title"></div>
      <div id="weakalgo-body"></div>
      <table id="weakalgo-list"><tbody></tbody></table>
      <div id="weakalgo-note"></div>
      <div class="modal-buttons">
        <button id="wa-go" type="button">繼續連線</button>
        <button id="wa-cancel" type="button">取消</button>
      </div>
    </div>
  </div>

  <!-- 頁內對話框：取代舊版的 WPF InputDialog / MessageBox / LogDialog -->
  <div id="modal" hidden>
    <form id="modal-form">
      <div id="modal-title"></div>
      <div id="modal-prompt"></div>
      <input id="modal-input" type="text" autocomplete="off" spellcheck="false" />
      <div id="modal-extra" hidden>
        <button id="modal-browse" type="button">瀏覽…</button>
        <label><input id="modal-check1" type="checkbox" /><span id="modal-check1-text"></span></label>
        <label><input id="modal-check2" type="checkbox" /><span id="modal-check2-text"></span></label>
      </div>
      <div class="modal-buttons">
        <button id="modal-ok" type="submit">確定</button>
        <button id="modal-cancel" type="button">取消</button>
      </div>
    </form>
  </div>

  <!-- 設定（舊版 Dialogs/SettingsDialog）：語言／字體背景顏色／Claude 輸入送出／檔案總管，
       外加一組「新版多的」（舊版只能手改 settings.json 的欄位）。
       套用時機照舊版：**按「確定」才套**（取消＝什麼都不動）。 -->
  <div id="setdlg" hidden>
    <form id="setdlg-box">
      <div id="setdlg-title"></div>

      <fieldset>
        <legend id="st-l-lang"></legend>
        <div class="st-radios">
          <label><input type="radio" name="st-lang" id="st-lang-zh" value="zh" /><span>中文</span></label>
          <label><input type="radio" name="st-lang" id="st-lang-en" value="en" /><span>English</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend id="st-l-font"></legend>
        <div class="st-grid">
          <label id="st-l-family" for="st-family"></label>
          <span class="sd-row"><input id="st-family" list="st-fonts" autocomplete="off" spellcheck="false" />
            <datalist id="st-fonts"></datalist></span>

          <label id="st-l-size" for="st-size"></label>
          <span class="sd-row"><input id="st-size" type="number" min="6" max="40" step="1" /></span>

          <label id="st-l-fg" for="st-fg"></label>
          <span class="sd-row"><input id="st-fg" autocomplete="off" spellcheck="false" />
            <input id="st-fg-pick" type="color" /></span>

          <label id="st-l-bg" for="st-bg"></label>
          <span class="sd-row"><input id="st-bg" autocomplete="off" spellcheck="false" />
            <input id="st-bg-pick" type="color" /></span>
        </div>
      </fieldset>

      <fieldset>
        <legend id="st-l-ime"></legend>
        <div class="st-grid">
          <label id="st-l-imequiet" for="st-imequiet"></label>
          <span class="sd-row"><input id="st-imequiet" type="number" min="0" max="150" step="1" />
            <button id="st-imehelp" type="button" class="link-btn"></button></span>
        </div>
      </fieldset>

      <fieldset>
        <legend id="st-l-more"></legend>
        <div class="st-grid">
          <label id="st-l-restorelines" for="st-restorelines"></label>
          <span class="sd-row"><input id="st-restorelines" type="number" min="0" max="100000" step="100" />
            <span id="st-restorelines-hint" class="sd-hint"></span></span>

          <label id="st-l-keepalive" for="st-keepalive"></label>
          <span class="sd-row"><input id="st-keepalive" type="number" min="0" max="1440" step="1" /></span>

          <label id="st-l-logdir" for="st-logdir"></label>
          <span class="sd-row"><input id="st-logdir" autocomplete="off" spellcheck="false" />
            <button id="st-logdir-pick" type="button"></button></span>
        </div>
        <label class="sd-check"><input id="st-exitrestore" type="checkbox" /><span id="st-l-exitrestore"></span></label>
        <label class="sd-check"><input id="st-autoreconnect" type="checkbox" /><span id="st-l-autoreconnect"></span></label>
        <label class="sd-check"><input id="st-logts" type="checkbox" /><span id="st-l-logts"></span></label>
        <label class="sd-check"><input id="st-logappend" type="checkbox" /><span id="st-l-logappend"></span></label>
      </fieldset>

      <fieldset>
        <legend id="st-l-sandbox"></legend>
        <label class="sd-check"><input id="st-sandboxdefault" type="checkbox" /><span id="st-l-sandboxdefault"></span></label>
        <div id="st-sandbox-note" class="sd-hint"></div>
        <div class="sd-row st-weak">
          <button id="st-weak-clear" type="button"></button>
          <span id="st-weak-count" class="sd-hint"></span>
        </div>
      </fieldset>

      <fieldset>
        <legend id="st-l-shell"></legend>
        <label class="sd-check"><input id="st-shellmenu" type="checkbox" disabled /><span id="st-l-shellmenu"></span></label>
        <div id="st-shell-note" class="sd-hint"></div>
      </fieldset>

      <div id="st-note" class="sd-hint"></div>
      <div class="modal-buttons">
        <button id="st-reset" type="button"></button>
        <button id="st-ok" type="submit"></button>
        <button id="st-cancel" type="button"></button>
      </div>
    </form>
  </div>

  <!-- 關於（舊版 About_Click 動態組出來的視窗）：版本／編譯時間／作者／下載／原始碼／
       授權／第三方元件＋「檢查更新」。檢查更新**只有按下去才查**（舊版沒有啟動時自動查）。 -->
  <div id="aboutdlg" hidden>
    <div id="aboutdlg-box">
      <div id="about-name">AwayTerminal</div>
      <div id="about-rows"></div>
      <details id="about-notices">
        <summary id="about-notices-label"></summary>
        <pre id="about-notices-text"></pre>
      </details>
      <div class="modal-buttons">
        <span id="about-status" class="sd-hint"></span>
        <button id="about-check" type="button"></button>
        <button id="about-close" type="button"></button>
      </div>
    </div>
  </div>

  <!-- 有新版時才跳（舊版 ShowUpdateDialog）：目前／最新版本＋更新內容，按鈕開軟體頁 -->
  <div id="updatedlg" hidden>
    <div id="updatedlg-box">
      <div id="up-title"></div>
      <div id="up-rows"></div>
      <div id="up-notes-label" class="sd-hint"></div>
      <pre id="up-notes"></pre>
      <div class="modal-buttons">
        <button id="up-go" type="button"></button>
        <button id="up-close" type="button"></button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
