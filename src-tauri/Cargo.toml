[package]
name = "awayterminal"
version = "2.0.0"
description = "AwayTerminal 2 — cross-platform terminal"
authors = ["awaysu"]
edition = "2021"
rust-version = "1.89"

[lib]
name = "awayterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
chrono = { version = "0.4.45", features = ["clock"] }
# 用 `ring` 而不是 russh 預設的 `aws-lc-rs`：後者在 Windows 上要裝 NASM 才編得過
#（`NASM command not found! Build cannot continue.`），對「clone 下來就能建置」是一個硬門檻。
# `des` 是舊設備要的 3des-cbc（CLAUDE.md 風險 3）；`rsa` 要留給 ssh-rsa 的舊主機。
russh = { version = "0.63.3", default-features = false, features = ["ring", "des", "rsa", "flate2"] }
# MD5 指紋（PuTTY 舊版格式）。russh 已經把這個版本拉進依賴樹，所以不會多編一份。
md5 = "0.8"
# 連接埠（COM）。⚠️ **MPL-2.0**（不是 MIT）：可以連進 MIT 專案，但散布時要附授權全文，
# 而且**我們沒有改過它的原始碼**（改了才會觸發同檔案的 copyleft）。見 THIRD-PARTY-NOTICES.md。
# Linux 的 `libudev` 預設功能要系統有 libudev（做 Linux 版時再處理，見 docs/COM.md）。
serialport = "4.10.1"
fancy-regex = "0.19.2"
encoding_rs = "0.8.42"
# 「檢查更新」的 HTTPS GET（舊版是 .NET 的 HttpClient）。MIT OR Apache-2.0。
# 預設帶 rustls + webpki-roots（不碰系統憑證庫，跨平台行為一致）。
# ⚠️ 這是**唯一**一個會連外的功能，而且只有使用者按下「檢查更新」才會跑。
ureq = "3.4.2"
# 第一次啟動時的系統語言（對到我們支援的八種介面語言）。MIT OR Apache-2.0。
# 只讀，不改任何系統設定。
sys-locale = "0.3.2"
tauri-plugin-single-instance = "2.4.5"
# 角色檔的「使用者沒改過就自動換新版」比對（舊版 RoleLibrary 的 .defaults.json 雜湊）。
# russh 已經把同一個版本拉進依賴樹，所以不會多編一份。
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
libloading = "0.8"
winreg = "0.56.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
# ssh_probe 的測試伺服器與 hostkey 的單元測試要產生金鑰
rand = "0.10"
