[package]
name = "awayterminal"
version = "0.1.0"
description = "AwayTerminal 2 — cross-platform terminal"
authors = ["awaysu"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "awayterminal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
